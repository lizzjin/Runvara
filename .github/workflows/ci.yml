name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Run all checks
        run: ./scripts/check-all.sh

      - name: Audit locked dependencies
        run: |
          if [[ ! -x target/cargo-audit/bin/cargo-audit ]]; then
            cargo install cargo-audit --locked --version 0.22.2 --root target/cargo-audit
          fi
          target/cargo-audit/bin/cargo-audit audit --deny warnings --file Cargo.lock
          if [[ ! -x target/cargo-deny/bin/cargo-deny ]]; then
            cargo install cargo-deny --locked --version 0.20.2 --root target/cargo-deny
          fi
          target/cargo-deny/bin/cargo-deny check
          node scripts/audit-dashboard.mjs

      - name: Validate Docker Compose manifest
        env:
          RUNVARA_COMPOSE_ENV_FILE: deploy/docker/runvara.env.example
        run: docker compose --env-file deploy/docker/runvara.env.example config --quiet

  postgres-e2e:
    name: PostgreSQL dashboard E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: runvara
          POSTGRES_USER: runvara
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runvara -d runvara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      CARGO_TERM_COLOR: always
      RUNVARA_BIND: 127.0.0.1:38082
      RUNVARA_DATABASE_URL: postgres://runvara:ci-postgres-password@127.0.0.1:5432/runvara
      RUNVARA_TEST_DATABASE_URL: postgres://runvara:ci-postgres-password@127.0.0.1:5432/runvara
      RUNVARA_DATABASE_TLS_MODE: disable
      RUNVARA_AUTH_TOKEN: ci-router-token-with-sufficient-entropy
      RUNVARA_ADMIN_USERNAME: admin
      RUNVARA_ADMIN_PASSWORD: MpCi_7vN4qL9tR2xK6m
      RUNVARA_DEFAULT_PROVIDER: custom
      CUSTOM_OPENAI_BASE_URL: http://127.0.0.1:38084/v1
      CUSTOM_OPENAI_API_KEY: ci-custom-provider-key-with-sufficient-entropy
      CUSTOM_OPENAI_MODEL: ci-model

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            e2e-cargo-${{ runner.os }}-${{ runner.arch }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dashboard and browser dependencies
        run: |
          npm --prefix dashboard ci --no-audit --no-fund
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Build and start PostgreSQL-backed Runvara
        run: |
          cargo test --locked postgres_critical_paths_use_database_transactions_and_aggregation
          cargo build --locked --bin runvara
          export RUNVARA_CONFIG="${RUNNER_TEMP}/runvara-no-config.toml"
          export RUNVARA_ENV_FILE="${RUNNER_TEMP}/runvara-no-env"
          target/debug/runvara > "${RUNNER_TEMP}/runvara-e2e.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/runvara-e2e.pid"
          for attempt in {1..80}; do
            if curl -fsS http://127.0.0.1:38082/livez >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/runvara-e2e.pid")" 2>/dev/null; then
              sed -n '1,200p' "${RUNNER_TEMP}/runvara-e2e.log"
              exit 1
            fi
            sleep 0.25
          done
          sed -n '1,200p' "${RUNNER_TEMP}/runvara-e2e.log"
          exit 1

      - name: Run dashboard E2E
        run: npm --prefix dashboard run e2e

      - name: Stop backend
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/runvara-e2e.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/runvara-e2e.pid")" 2>/dev/null || true
          fi

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgres-dashboard-e2e-diagnostics
          path: |
            ${{ runner.temp }}/runvara-e2e.log
            dashboard/playwright-report
            dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7
