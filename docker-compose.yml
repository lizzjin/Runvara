name: runvara

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RUNVARA_POSTGRES_DB:-runvara}
      POSTGRES_USER: ${RUNVARA_POSTGRES_USER:-runvara}
      POSTGRES_PASSWORD: ${RUNVARA_POSTGRES_PASSWORD:?set RUNVARA_POSTGRES_PASSWORD in .env}
    volumes:
      - runvara-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  runvara:
    build:
      context: .
      dockerfile: Dockerfile
    image: runvara:local
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ${RUNVARA_COMPOSE_ENV_FILE:-.env}
    environment:
      RUNVARA_BIND: 0.0.0.0:17878
      RUNVARA_ENV_FILE: /config/.env
      RUNVARA_STATE_DIR: /data
      RUNVARA_CONTROL_STORE: /data/control-plane.json
      RUNVARA_CONFIG: /config/config.toml
      RUNVARA_DATABASE_URL: ${RUNVARA_DATABASE_URL:-postgres://${RUNVARA_POSTGRES_USER:-runvara}:${RUNVARA_POSTGRES_PASSWORD:?set RUNVARA_POSTGRES_PASSWORD in .env}@postgres:5432/${RUNVARA_POSTGRES_DB:-runvara}}
      RUNVARA_TRUSTED_PROXIES: ${RUNVARA_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      RUNVARA_ALLOWED_ORIGINS: ${RUNVARA_ALLOWED_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-runvara=info,tower_http=info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RUNVARA_API_PUBLISH:-127.0.0.1:17878}:17878"
    volumes:
      - runvara-data:/data
      - type: bind
        source: ${RUNVARA_COMPOSE_ENV_FILE:-./.env}
        target: /config/.env
        read_only: true
      # Optional file-based provider config:
      # - ./config.toml:/config/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: runvara-dashboard:local
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    depends_on:
      runvara:
        condition: service_healthy
    ports:
      - "${RUNVARA_DASHBOARD_PUBLISH:-127.0.0.1:5173}:8080"
    restart: unless-stopped

volumes:
  runvara-data:
  runvara-postgres:
