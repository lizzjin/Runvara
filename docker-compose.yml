name: runvara

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${RUNVARA_POSTGRES_DB:-runvara}
      POSTGRES_USER: ${RUNVARA_POSTGRES_USER:-runvara}
      POSTGRES_PASSWORD: ${RUNVARA_POSTGRES_PASSWORD:?set RUNVARA_POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - runvara-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: ${RUNVARA_POSTGRES_STOP_GRACE_PERIOD:-1m}
    logging:
      driver: json-file
      options:
        max-size: ${RUNVARA_LOG_MAX_SIZE:-10m}
        max-file: "${RUNVARA_LOG_MAX_FILES:-5}"

  runvara:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNVARA_VERSION: ${RUNVARA_VERSION:-0.1.0}
        RUNVARA_SOURCE_REVISION: ${RUNVARA_SOURCE_REVISION:-unknown}
        RUNVARA_SOURCE_STATE: ${RUNVARA_SOURCE_STATE:-unknown}
        RUNVARA_BUILD_DATE: ${RUNVARA_BUILD_DATE:-unknown}
    image: ${RUNVARA_IMAGE:-runvara:local}
    pull_policy: ${RUNVARA_PULL_POLICY:-never}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ${RUNVARA_COMPOSE_ENV_FILE:-.env}
    environment:
      RUNVARA_BIND: 0.0.0.0:38082
      RUNVARA_ENV_FILE: /config/.env
      RUNVARA_STATE_DIR: /data
      RUNVARA_CONFIG: /config/config.toml
      RUNVARA_DATABASE_URL: ${RUNVARA_DATABASE_URL:-postgres://${RUNVARA_POSTGRES_USER:-runvara}:${RUNVARA_POSTGRES_PASSWORD:?set RUNVARA_POSTGRES_PASSWORD in .env}@postgres:5432/${RUNVARA_POSTGRES_DB:-runvara}}
      RUNVARA_TRUSTED_PROXIES: ${RUNVARA_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      RUNVARA_ALLOWED_ORIGINS: ${RUNVARA_ALLOWED_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-runvara=info,tower_http=info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RUNVARA_API_PUBLISH:-127.0.0.1:38082}:38082"
    volumes:
      - runvara-data:/data
      - type: bind
        source: ${RUNVARA_COMPOSE_ENV_FILE:-./.env}
        target: /config/.env
        read_only: true
      # Optional file-based provider config:
      - ./config.toml:/config/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    # The image-level healthcheck is liveness-only. Compose overrides it with
    # authenticated storage readiness so `healthy` means the gateway may take
    # traffic. Shared deployments should issue a dedicated scoped probe key.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          probe_key="$${RUNVARA_HEALTHCHECK_API_KEY:-$${RUNVARA_AUTH_TOKEN:-}}";
          test -n "$${probe_key}" &&
          curl -fsS -H "x-api-key: $${probe_key}" http://127.0.0.1:38082/readyz >/dev/null
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    # Default request timeout is 600s and finalizer drain is 30s. This window
    # lets an ordinary in-flight request finish before Docker sends SIGKILL.
    stop_grace_period: ${RUNVARA_STOP_GRACE_PERIOD:-11m}
    logging:
      driver: json-file
      options:
        max-size: ${RUNVARA_LOG_MAX_SIZE:-10m}
        max-file: "${RUNVARA_LOG_MAX_FILES:-5}"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        RUNVARA_VERSION: ${RUNVARA_VERSION:-0.1.0}
        RUNVARA_SOURCE_REVISION: ${RUNVARA_SOURCE_REVISION:-unknown}
        RUNVARA_SOURCE_STATE: ${RUNVARA_SOURCE_STATE:-unknown}
        RUNVARA_BUILD_DATE: ${RUNVARA_BUILD_DATE:-unknown}
    image: ${RUNVARA_DASHBOARD_IMAGE:-runvara-dashboard:local}
    pull_policy: ${RUNVARA_PULL_POLICY:-never}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "${RUNVARA_DASHBOARD_PUBLISH:-127.0.0.1:33002}:8080"
    restart: unless-stopped
    stop_grace_period: ${RUNVARA_DASHBOARD_STOP_GRACE_PERIOD:-30s}
    logging:
      driver: json-file
      options:
        max-size: ${RUNVARA_LOG_MAX_SIZE:-10m}
        max-file: "${RUNVARA_LOG_MAX_FILES:-5}"

  ops-agent:
    profiles: ["ops-agent"]
    build:
      context: .
      dockerfile: ops-agent/Dockerfile
      args:
        RUNVARA_VERSION: ${RUNVARA_VERSION:-0.1.0}
        RUNVARA_SOURCE_REVISION: ${RUNVARA_SOURCE_REVISION:-unknown}
        RUNVARA_SOURCE_STATE: ${RUNVARA_SOURCE_STATE:-unknown}
        RUNVARA_BUILD_DATE: ${RUNVARA_BUILD_DATE:-unknown}
    image: ${RUNVARA_OPS_AGENT_IMAGE:-runvara-ops-agent:local}
    pull_policy: ${RUNVARA_PULL_POLICY:-never}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${RUNVARA_OPS_CPU_LIMIT:-0.50}
    mem_limit: ${RUNVARA_OPS_MEMORY_LIMIT:-256m}
    pids_limit: ${RUNVARA_OPS_PIDS_LIMIT:-128}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      RUNVARA_OPS_BASE_URL: http://runvara:38082
      RUNVARA_OPS_API_KEY: ${RUNVARA_OPS_API_KEY:-}
      RUNVARA_OPS_MODEL_API_KEY: ${RUNVARA_OPS_MODEL_API_KEY:-}
      RUNVARA_OPS_MODE: ${RUNVARA_OPS_MODE:-shadow}
      RUNVARA_OPS_INTERVAL_SECONDS: ${RUNVARA_OPS_INTERVAL_SECONDS:-300}
      RUNVARA_OPS_WEBHOOK_URL: ${RUNVARA_OPS_WEBHOOK_URL:-}
      RUST_LOG: ${RUNVARA_OPS_RUST_LOG:-runvara_ops_agent=info}
    volumes:
      - runvara-ops-spool:/var/lib/runvara-ops
    depends_on:
      runvara:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:38083/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${RUNVARA_LOG_MAX_SIZE:-10m}
        max-file: "${RUNVARA_LOG_MAX_FILES:-5}"

volumes:
  runvara-data:
  runvara-postgres-18:
  runvara-ops-spool:

networks:
  default:
    name: ${RUNVARA_NETWORK_NAME:-runvara_default}
    external: true
