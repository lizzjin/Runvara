groups:
  - name: runvara.availability
    rules:
      - alert: RunvaraMetricsTargetDown
        expr: up{job="runvara"} == 0
        for: 2m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: Runvara metrics target is unreachable
          description: Prometheus has been unable to scrape {{ $labels.instance }} for two minutes.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvarametricstargetdown

      - alert: RunvaraNotReady
        expr: runvara_gateway_ready == 0
        for: 2m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: Runvara is alive but not ready for governed traffic
          description: Fail-closed gateway dependencies on {{ $labels.instance }} have been unready for two minutes.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaranotready

      # Optional independent endpoint probe. It remains silent when the
      # Blackbox Exporter example has not been installed.
      - alert: RunvaraReadinessProbeFailed
        expr: probe_success{job="runvara-readiness"} == 0
        for: 2m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: Runvara authenticated readiness endpoint is unreachable
          description: The independent /readyz probe for {{ $labels.instance }} has failed for two minutes.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaranotready

      - alert: RunvaraDirtyBuildRunning
        expr: runvara_build_info{source_state!="clean"} == 1
        for: 10m
        labels:
          severity: warning
          component: release
        annotations:
          summary: A non-release Runvara build is running
          description: Instance {{ $labels.instance }} reports source_state={{ $labels.source_state }}.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaradirtybuildrunning

  - name: runvara.storage
    rules:
      - alert: RunvaraDatabaseNotReady
        expr: runvara_database_ready == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: Runvara cannot complete its PostgreSQL readiness query
          description: PostgreSQL readiness is failing on {{ $labels.instance }}.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaranotready

      - alert: RunvaraDatabasePoolSaturated
        expr: runvara_database_pool_utilization_ratio > 0.85
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: Runvara PostgreSQL pool utilization is above 85%
          description: Instance {{ $labels.instance }} has sustained pool utilization of {{ $value | humanizePercentage }} for five minutes.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaradatabasepoolsaturated

      - alert: RunvaraLedgerOperationDegraded
        expr: runvara_ledger_operation_degraded == 1
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: Runvara ledger operation is degraded
          description: The most recent {{ $labels.operation }} operation failed on {{ $labels.instance }}.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraledgeroperationdegraded

      - alert: RunvaraLedgerFailuresDetected
        expr: increase(runvara_ledger_operation_failures_total[10m]) > 0
        labels:
          severity: warning
          component: database
        annotations:
          summary: Runvara ledger failures occurred
          description: Operation {{ $labels.operation }} failed {{ $value | humanize }} time(s) in ten minutes on {{ $labels.instance }}.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraledgeroperationdegraded

      - alert: RunvaraPendingFinalizersStuck
        expr: runvara_ledger_pending_finalizers > 0
        for: 2m
        labels:
          severity: critical
          component: ledger
        annotations:
          summary: Runvara request finalizers are not settling
          description: Instance {{ $labels.instance }} has {{ $value | humanize }} pending finalizer(s) after two minutes.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvarapendingfinalizersstuck

      - alert: RunvaraExpiredLeasesReconciled
        expr: >-
          increase(runvara_ledger_reconciled_requests_total[15m])
          + increase(runvara_ledger_reconciled_attempts_total[15m]) > 0
        labels:
          severity: warning
          component: ledger
        annotations:
          summary: Runvara reconciled expired request leases
          description: Instance {{ $labels.instance }} reconciled {{ $value | humanize }} expired request/attempt lease(s) in fifteen minutes.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraexpiredleasesreconciled

  - name: runvara.traffic
    rules:
      - alert: RunvaraInferenceErrorRateHigh
        expr: >-
          (
            sum(rate(runvara_message_failures_total[10m]))
            /
            clamp_min(sum(rate(runvara_message_requests_total[10m])), 0.001)
          ) > 0.10
          and
          sum(increase(runvara_message_requests_total[10m])) >= 20
        for: 5m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: Runvara inference error rate is above 10%
          description: The ten-minute inference error ratio is {{ $value | humanizePercentage }}.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvarainferenceerrorratehigh

      - alert: RunvaraInferenceP95LatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(runvara_message_latency_ms_bucket[10m]))
          ) > 120000
          and
          sum(increase(runvara_message_latency_ms_count[10m])) >= 20
        for: 10m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: Runvara inference p95 latency is above two minutes
          description: Global end-to-end p95 latency is {{ $value | humanize }} ms; compare with Provider generation time before changing gateway limits.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvarainferencep95latencyhigh

      - alert: RunvaraAdmissionOrStreamPressure
        expr: >-
          sum by (phase) (
            increase(runvara_inference_rejections_total{phase=~"admission|concurrency"}[10m])
          ) > 0
        for: 5m
        labels:
          severity: warning
          component: admission
        annotations:
          summary: Runvara is rejecting work at admission or stream concurrency
          description: Phase {{ $labels.phase }} rejected {{ $value | humanize }} request(s) in ten minutes.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraadmissionorstreampressure

      - alert: RunvaraLocalInteractiveQueueWaiting
        expr: runvara_local_scheduler_oldest_interactive_wait_ms > 30000
        for: 5m
        labels:
          severity: warning
          component: queue
        annotations:
          summary: Runvara local interactive queue wait exceeds 30 seconds
          description: The oldest interactive request on {{ $labels.instance }} has waited {{ $value | humanize }} ms.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraadmissionorstreampressure

      - alert: RunvaraLocalBatchQueueWaiting
        expr: runvara_local_scheduler_oldest_batch_wait_ms > 300000
        for: 10m
        labels:
          severity: warning
          component: queue
        annotations:
          summary: Runvara local batch queue wait exceeds five minutes
          description: The oldest batch request on {{ $labels.instance }} has waited {{ $value | humanize }} ms.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraadmissionorstreampressure

      - alert: RunvaraStreamPermitsExhausted
        expr: >-
          runvara_stream_permits_available == 0
          and on (instance)
          sum by (instance) (
            increase(runvara_inference_rejections_total{phase="concurrency"}[5m])
          ) > 0
        for: 2m
        labels:
          severity: warning
          component: stream
        annotations:
          summary: Runvara stream permits are exhausted and requests are being rejected
          description: Instance {{ $labels.instance }} has no stream permits and recorded concurrency rejection(s).
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraadmissionorstreampressure

      - alert: RunvaraQuotaRejectionsDetected
        expr: >-
          sum(increase(runvara_inference_rejections_total{reason="quota_exceeded"}[15m])) > 0
        labels:
          severity: warning
          component: budget
        annotations:
          summary: Runvara rejected requests for quota exhaustion
          description: "{{ $value | humanize }} pre-ledger request(s) were rejected for quota exhaustion in fifteen minutes."
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraquotarejectionsdetected

  - name: runvara.providers
    rules:
      - alert: RunvaraProviderUnavailable
        expr: runvara_provider_available == 0
        for: 5m
        labels:
          severity: critical
          component: provider
        annotations:
          summary: A configured Runvara Provider is unavailable
          description: Provider {{ $labels.provider }} has no usable credential or is cooling down on {{ $labels.instance }}.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraprovidererrorratehigh

      - alert: RunvaraProviderCoolingDown
        expr: runvara_provider_cooldown == 1
        for: 2m
        labels:
          severity: warning
          component: provider
        annotations:
          summary: Runvara has placed a Provider in cooldown
          description: Provider {{ $labels.provider }} is cooling down on {{ $labels.instance }} after retryable/account failures.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraprovidererrorratehigh

      - alert: RunvaraProviderErrorRateHigh
        expr: >-
          (
            sum by (provider) (
              rate(runvara_message_failures_total{provider!="__overflow__"}[10m])
            )
            /
            clamp_min(
              sum by (provider) (
                rate(runvara_message_requests_total{provider!="__overflow__"}[10m])
              ),
              0.001
            )
          ) > 0.20
          and on (provider)
          sum by (provider) (
            increase(runvara_message_requests_total{provider!="__overflow__"}[10m])
          ) >= 10
        for: 5m
        labels:
          severity: critical
          component: provider
        annotations:
          summary: Runvara Provider error rate is above 20%
          description: Provider {{ $labels.provider }} has a ten-minute error ratio of {{ $value | humanizePercentage }}.
          runbook_url: https://github.com/lizzjin/Runvara/blob/main/docs/OBSERVABILITY_RUNBOOK.md#runvaraprovidererrorratehigh
